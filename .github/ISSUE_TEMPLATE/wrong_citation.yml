name: Wrong or outdated citation
description: An answer cited a clause that does not support the claim, or that is out of date.
labels: [citation]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Citation reports are reviewed by a human and may become eval cases.
        Do not include personal or client details in the question.
  - type: textarea
    id: question
    attributes:
      label: The question
      description: The question as you asked it.
    validations:
      required: true
  - type: input
    id: cited-reference
    attributes:
      label: The cited reference
      description: The ref shown in the answer.
      placeholder: R205(c)(ii)
    validations:
      required: true
  - type: textarea
    id: correct-source
    attributes:
      label: What the correct source says
      description: Quote or summarise the text that should have been cited, with its section number and date if you have them.
    validations:
      required: true
  - type: input
    id: source-link
    attributes:
      label: Link to the correct source
      description: The official page (laws-lois.justice.gc.ca or canada.ca).
      placeholder: https://laws-lois.justice.gc.ca/eng/regulations/SOR-2002-227/section-205.html
    validations:
      required: true
  - type: input
    id: answer-id
    attributes:
      label: Answer ID
      description: The answer_id from the response, if you have it.
