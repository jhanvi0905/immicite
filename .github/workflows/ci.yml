name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: immicite
          POSTGRES_PASSWORD: immicite
          POSTGRES_DB: immicite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immicite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://immicite:immicite@localhost:5432/immicite_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Layer boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest

      - name: No government text committed
        run: test -z "$(git ls-files data)"
