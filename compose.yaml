# Local development database: Postgres 17 + pgvector. Start with `docker compose up -d`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: immicite
      POSTGRES_PASSWORD: immicite
      POSTGRES_DB: immicite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immicite"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
