[project]
name = "immicite"
version = "0.1.0"
description = "Cited answers on Canadian immigration rules for licensed practitioners."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
immicite = "app.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Domain imports no other layer"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.services", "app.integrations", "app.cli", "app.main", "app.config"]

[[tool.importlinter.contracts]]
name = "Nothing imports from api"
type = "forbidden"
source_modules = ["app.domain", "app.services", "app.integrations", "app.cli", "app.config"]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "Services depend on domain ports, not integrations"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.integrations"]
