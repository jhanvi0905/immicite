# The corpus registry: every document the ingest job pulls.
# URLs and metadata only. Source text is never committed.
#
# authority, highest first: act, regulations, ministerial_instructions,
#   officer_instructions, public_guidance.
# kind: law_xml (Justice Laws consolidated XML) or web_page (a Canada.ca page).
# url: what the job downloads. For law, web_url is the reading site that citations link to.
# slug: given for law. A page's slug is derived from its url, so it is never written here.

sources:
  # ---- Law ----
  - slug: irpa
    title: Immigration and Refugee Protection Act
    authority: act
    kind: law_xml
    ref_prefix: A
    web_url: https://laws-lois.justice.gc.ca/eng/acts/I-2.5/
    url: https://laws-lois.justice.gc.ca/eng/XML/I-2.5.xml
    licence: Reproduction of Federal Law Order (SI/97-5)

